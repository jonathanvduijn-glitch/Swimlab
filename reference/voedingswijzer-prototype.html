<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voedingswijzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE7; --surface:#F7F9F5; --ink:#15302A; --muted:#5D706A; --line:#CBD6CD;
  --leaf:#2F7A4B; --leaf-soft:#D3E8D6; --citrus:#E9A923; --citrus-soft:#F7E6BE;
  --berry:#93305E; --berry-soft:#F0D7E2; --sky:#2C6E8F; --warn:#C2410C;
  --track:#DCE4DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C18; --surface:#172823; --ink:#E5EFE8; --muted:#94AAA2; --line:#2A403A;
    --leaf:#5DBB7E; --leaf-soft:#1F3D2C; --citrus:#F2BE4A; --citrus-soft:#3F3218;
    --berry:#E07FAA; --berry-soft:#3D2030; --sky:#6BB5D8; --warn:#F28A5C; --track:#24372F;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1C18; --surface:#172823; --ink:#E5EFE8; --muted:#94AAA2; --line:#2A403A;
    --leaf:#5DBB7E; --leaf-soft:#1F3D2C; --citrus:#F2BE4A; --citrus-soft:#3F3218;
    --berry:#E07FAA; --berry-soft:#3D2030; --sky:#6BB5D8; --warn:#F28A5C; --track:#24372F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:20px 16px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--leaf)}

/* today */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.dayhead h1{font-size:28px;font-weight:800}
.dayhead .arrows{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.budget{background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 20px 20px;margin-bottom:14px}
.budget .big{font-family:"Bricolage Grotesque",sans-serif;font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1}
.budget .sub{opacity:.75;font-size:15px;margin-top:4px}
.budget .bar{height:10px;border-radius:6px;background:color-mix(in srgb,var(--bg) 22%,transparent);margin-top:16px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--citrus);border-radius:6px;transition:width .4s}
.budget .row{display:flex;justify-content:space-between;font-size:14px;opacity:.8;margin-top:8px}
.macros{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.macro{background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line)}
.macro .lbl{font-size:14px;color:var(--muted)}
.macro .v{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:600}
.macro .v small{font-size:14px;color:var(--muted);font-family:Figtree,sans-serif;font-weight:400}
.track{height:7px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;border-radius:4px;transition:width .4s}
.macro.p .track i{background:var(--berry)} .macro.c .track i{background:var(--citrus)}
.macro.f .track i{background:var(--sky)} .macro.fib .track i{background:var(--leaf)}
h2.sec{font-size:20px;font-weight:600;margin:26px 0 10px}
.microlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.micro{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.micro:last-child{border-bottom:0}
.micro .track{margin:0}
.micro .track i{background:var(--leaf)}
.micro.low .track i{background:var(--citrus)}
.micro .pct{text-align:right;color:var(--muted)}
.logitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.logitem .nm{flex:1;min-width:0}
.logitem .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logitem .nm span{font-size:13px;color:var(--muted)}
.logitem .kc{font-weight:600}
.del{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--leaf);color:#fff}
.btn.ghost{background:transparent;color:var(--leaf);border:1.5px solid var(--leaf)}

/* discover */
.disc-h{font-size:28px;font-weight:800;margin-bottom:4px}
.disc-p{color:var(--muted);margin:0 0 14px;font-size:15px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortrow{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.sortrow select{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.food{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.food>button{width:100%;border:0;background:none;text-align:left;padding:14px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.score{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;position:relative}
.score svg{position:absolute;inset:0;transform:rotate(-90deg)}
.food .t b{font-weight:600;display:block}
.food .t span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.top{background:var(--leaf-soft);color:var(--leaf)}
.tag.dense{background:var(--citrus-soft);color:color-mix(in srgb,var(--citrus) 60%,var(--ink))}
.food .kc{text-align:right}
.food .kc b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;display:block;line-height:1}
.food .kc span{font-size:12px;color:var(--muted)}
.strip{display:flex;gap:2px;height:6px;margin:0 14px 12px}
.strip i{flex:1;border-radius:2px;background:var(--track)}
.detail{padding:0 14px 14px;display:none}
.food.open .detail{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px;margin-bottom:12px}
.dgrid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.dgrid div span:last-child{color:var(--muted)}
.dgrid .hi span:last-child{color:var(--leaf);font-weight:600}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{width:90px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right}
.addrow .prev{flex:1;font-size:13px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:0 0 14px}

/* profile */
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.field small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.field input,.field select{width:130px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right}
.field select{text-align:left}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.targets div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.targets span{display:block;font-size:13px;color:var(--muted)}
.targets b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}

/* sheet */
dialog{border:0;border-radius:20px;padding:20px;background:var(--surface);color:var(--ink);width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{font-size:20px;margin-bottom:12px}
dialog .field input{width:110px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* plan */
.plansum{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.plansum div{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px}
.plansum span{display:block;font-size:12px;opacity:.75}
.plansum b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;display:block;line-height:1.2}
.plansum small{font-size:12px;opacity:.65}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mealhead h3{font-size:20px}
.mealhead span{font-size:14px;color:var(--muted)}
.ing{list-style:none;margin:0 0 12px;padding:0}
.ing li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li span:last-child{color:var(--muted)}
.tips p{margin:0 0 12px;font-size:15px}
.tips b{font-weight:600}
.stylesel{display:flex;margin:10px 0 10px}.stylesel button{flex:1}
.banner{background:var(--leaf-soft);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px}
.banner.warn{background:var(--citrus-soft)}
.banner b{font-weight:600}
.meal.done{background:var(--leaf-soft);border-color:transparent}
.meal.muted{opacity:.55}
.ok{font-family:Figtree,sans-serif;font-size:13px;font-weight:600;color:var(--leaf);margin-left:6px}
.mealacts{display:flex;gap:8px;flex-wrap:wrap}
.mealacts .btn{flex:1 1 140px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0 0 6px;padding:0}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmprow{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cmprow span{font-weight:600;grid-row:span 2;align-self:center}
.cmprow em{font-style:normal;font-size:12px;font-weight:600;background:var(--leaf);color:#fff;border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:1px}
.cmprow b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;text-align:right}
.cmprow small{font-size:12px;color:var(--muted);text-align:right}
.cmprow.best{border-color:var(--leaf);background:var(--leaf-soft)}
.ing.shop li{display:grid;grid-template-columns:30px 1fr 70px;gap:10px;align-items:center}
.ing.shop .nm b{display:block;font-weight:600;font-size:15px}
.ing.shop .nm small{display:block;font-size:13px;color:var(--muted)}
.ing.shop li.got .nm{opacity:.45;text-decoration:line-through}
.ing.shop li.got .pr{opacity:.45}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0;font-size:14px}
.tick[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.shophead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0}
.shophead span{font-size:13px;color:var(--muted)}
.ing.shop .pr{text-align:right;color:var(--ink)!important}
.daychips{margin-bottom:6px}
.daychip{min-width:46px;position:relative;text-align:center}
.daychip i{position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--berry)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;text-align:left;font-size:13px;font-weight:600;line-height:1.25}
.opt .ol{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:2px}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.shopcat{font-size:15px;margin:14px 0 4px;color:var(--muted);font-family:Figtree,sans-serif;font-weight:600}
/* supplements */
.cnt{font-family:Figtree,sans-serif;font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.crcard{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;margin-bottom:10px;display:block}
.crcard[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.crtop{display:flex;justify-content:space-between;align-items:flex-start}
.crtop b{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;display:block}
.crtop span{font-size:13px;color:var(--muted)}
.crbot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:12px}
.streak b{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;line-height:1;color:var(--berry)}
.streak span{display:block;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-transform:lowercase}
.dot i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:block}
.dot.on i{background:var(--berry);border-color:var(--berry)}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;flex:none}
[aria-pressed="true"] .check{background:var(--berry);border-color:var(--berry);color:#fff}
.supps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.supp{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.supp .check{margin-bottom:6px;width:22px;height:22px;font-size:12px}
.supp b{font-weight:600;font-size:15px}
.supp span.num{font-size:13px;color:var(--muted)}
.supp[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.srow{gap:8px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.knob{width:40px;height:24px;border-radius:12px;background:var(--track);position:relative;flex:none;transition:background .2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+.knob{background:var(--leaf)}
.sw input:checked+.knob::after{transform:translateX(16px)}
.sw input:focus-visible+.knob{outline:3px solid var(--sky);outline-offset:2px}
.dose{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.field .dose input{width:70px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Hoofdmenu"><div class="in" role="tablist">

  <button role="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profiel</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<dialog id="customDlg"></dialog>

<script>

  let bmr=+P.bmr>0?+P.bmr:(lbm?370+21.6*lbm:10*P.weight+6.25*P.height-5*P.age+(P.sex==='man'?5:-161));
  const tdee=bmr*P.act, kcal=+P.kcalTarget>0?Math.round(+P.kcalTarget):Math.round(tdee*P.goal/10)*10;
  const p=Math.round(P.pkg*P.weight), f=Math.round(kcal*0.27/9), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  const man=P.sex==='man';
  const t={kcal,p,c,f,bmr:Math.round(bmr),tdee:Math.round(tdee),
    fib:man?40:32, vc:75, va:man?800:680, vd:P.age>=70?20:10, b12:4.0, fol:300,
    fe:man?11:(P.age>=50?11:16), ca:P.age>=51&&!man?1100:1000, mg:man?350:300, k:3500, zn:man?11:8};
  return t;
}
// nutrient density: per kcal vs daily need per kcal, capped at 3x, averaged → 0–100
function score(food,T){
  if(!food.kcal) return 0;
  let s=0;SCORE_KEYS.forEach(k=>{const r=(food[k]/food.kcal)/(T[k]/T.kcal);s+=Math.min(r,3)/3});
  return Math.round(s/SCORE_KEYS.length*100);
}

const planStyle=()=>profile.planStyle==='variatie'?'variatie':'budget';
const weekKey=()=>planStyle()==='budget'?'weekB':'week';
const SLOTS=[['ontbijt','Ontbijt'],['lunch','Lunch'],['tussendoor','Tussendoor'],['avond','Avondeten'],['avondsnack','Avondsnack']];
const DAYS=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
let planW=(new Date().getDay()+6)%7, showShop=false;
const byName=n=>BASE.find(f=>f.name===n);
function optsFor(sid,w){const pool=POOLS[planStyle()][sid],n=pool.length;return [0,1,2].map(i=>pool[(w*3+i+Math.floor(w*3/n))%n])}
function planChoice(sid,w){const wk=profile[weekKey()]||{};return ((wk[w]||{})[sid])|0}
function rawItems(sid,w){return optsFor(sid,w)[planChoice(sid,w)][1]}
function planFactor(w){if(profile.autoScale===false)return 1;let k=0;SLOTS.forEach(([sid])=>rawItems(sid,w).forEach(([n,g])=>k+=byName(n).kcal*g/100));return Math.min(1.4,Math.max(0.7,targets().kcal/k))}
function portion(g,fac){return Math.max(5,Math.round(g*fac/5)*5)}
function mealItems(sid,w,fac){return rawItems(sid,w).map(([n,g])=>({f:byName(n),g:portion(g,fac)}))}
function sumItems(items){const t={};KEYS.forEach(k=>t[k]=0);items.forEach(({f,g})=>KEYS.forEach(k=>t[k]+=f[k]*g/100));return t}
function logItems(items,slot){const arr=logs[day]=logs[day]||[];items.forEach(({f,g})=>{const n={};KEYS.forEach(k=>n[k]=f[k]||0);const it={name:f.name,g,n};if(slot)it.slot=slot;arr.push(it)});save('log')}
let slotDone={}; // dateKey -> {slot:true}
function logW(){const [y,m,d]=day.split('-').map(Number);return (new Date(y,m-1,d).getDay()+6)%7}
function doneSlots(){const s=new Set(Object.keys(slotDone[day]||{}));(logs[day]||[]).forEach(it=>{if(it.slot)s.add(it.slot)});return s}
function overCheck(prefix){const T=targets(),k=totals(day,false).kcal;toast(k>T.kcal+25?`${prefix}. Let op: je zit nu ${fmt(k-T.kcal)} kcal boven je doel`:`${prefix}. Nog ${fmt(Math.max(0,T.kcal-k))} kcal over`)}
function dayPlan(w){
  const T=targets();
  if(w!==logW()){const fac=planFactor(w);return {live:false,fac,meals:SLOTS.map(([sid,name])=>({sid,name,items:mealItems(sid,w,fac),done:false}))}}
  const done=doneSlots(),eaten=totals(day,false);
  let raw=0;SLOTS.forEach(([sid])=>{if(!done.has(sid))rawItems(sid,w).forEach(([n,g])=>raw+=byName(n).kcal*g/100)});
  const left=T.kcal-eaten.kcal;
  const fac=profile.autoScale===false||raw<=0?1:Math.min(1.6,Math.max(0.4,left/raw));
  const meals=SLOTS.map(([sid,name])=>{
    if(done.has(sid)){const items=(logs[day]||[]).filter(it=>it.slot===sid).map(it=>({f:{...it.n,name:it.name},g:it.g}));return {sid,name,items,done:true,marked:!items.length}}
    return {sid,name,items:mealItems(sid,w,fac),done:false}});
  return {live:true,fac,meals,eaten,left,raw};
}

function shopList(){
  const tot={};
  for(let w=0;w<7;w++){const fac=planFactor(w);SLOTS.forEach(([sid])=>mealItems(sid,w,fac).forEach(({f,g})=>{tot[f.name]=(tot[f.name]||{f,g:0});tot[f.name].g+=g}))}
  const rows=Object.values(tot).map(x=>{const [aisle,sing,plur,buy,conv]=packOf(x.f);const need=x.g/conv;const n=Math.max(1,Math.ceil(need/buy-0.08));
    const packPrice=buy*conv/1000*priceOf(x.f);return {...x,aisle,label:`${n} ${n===1?sing:plur}`,need,n,cost:n*packPrice,used:x.g/1000*priceOf(x.f),left:Math.max(0,1-need/(n*buy))}});
  const kassa=rows.reduce((a,r)=>a+r.cost,0), used=rows.reduce((a,r)=>a+r.used,0);
  const sel=STORES.filter(([n])=>myStores().includes(n)).map(([n,idx])=>({n,idx,v:kassa*(1+idx/100),u:used*(1+idx/100)})).sort((a,b)=>a.v-b.v);
  const best=sel[0], fac=best?1+best.idx/100:1, done=profile.shopDone||{};
  const chips=STORES.map(([n])=>`<button class="chip" aria-pressed="${myStores().includes(n)}" data-store="${esc(n)}">${esc(n)}</button>`).join('');
  const cmp=sel.length?`<div class="cmp">${sel.map((s,i)=>`<div class="cmprow ${i===0?'best':''}"><span>${esc(s.n)}${i===0?'<em>Goedkoopst</em>':''}</span><b class="num">${euro(s.v)}</b><small class="num">${i===0?'aan de kassa':'+ '+euro(s.v-best.v)}</small></div>`).join('')}</div>
    <p class="legend" style="margin-top:8px">Van de ${euro(best.v)} eet je deze week voor ongeveer ${euro(best.u)} op. De rest blijft over als voorraad, zoals olie, havermout en pindakaas.</p>`
    :`<div class="empty" style="padding:14px">Tik hierboven de supermarkten aan die bij jou in de buurt zitten.</div>`;
  const nDone=rows.filter(r=>done[r.f.name]).length;
  const list=AISLES.filter(a=>rows.some(r=>r.aisle===a)).map(a=>`<h3 class="shopcat">${esc(a)}</h3><ul class="ing shop">${rows.filter(r=>r.aisle===a).sort((x,y)=>x.f.name.localeCompare(y.f.name)).map(r=>`<li class="${done[r.f.name]?'got':''}"><button class="tick" data-tick="${esc(r.f.name)}" aria-pressed="${!!done[r.f.name]}" aria-label="${esc(r.f.name)} afvinken"><span aria-hidden="true">✓</span></button><span class="nm"><b>${esc(r.f.name.replace(/ \((gebakken|gekookt|gegaard)\)/,''))}</b><small>${esc(r.label)}</small></span><span class="num pr">${euro(r.cost*fac)}</span></li>`).join('')}</ul>`).join('');
  return `<h3 class="shopcat" style="margin-top:4px">Supermarkten bij mij in de buurt</h3><div class="chips wrap">${chips}</div>
  <h3 class="shopcat">Geschatte kosten deze week</h3>${cmp}
  <p class="legend">Schatting op basis van gemiddelde huismerkprijzen en de prijspeiling van de Consumentenbond (6 mei 2026), zonder aanbiedingen.</p>
  <div class="shophead"><h3 class="shopcat" style="margin:0">Boodschappenlijst${best&&sel.length>1?' ('+esc(best.n)+')':''}</h3><span class="num">${nDone}/${rows.length} in je mandje</span></div>
  ${list}
  ${nDone?'<button class="btn ghost" style="width:100%;margin-top:12px" data-shopreset>Alle vinkjes weghalen</button>':''}`;
}

  if(D.live)KEYS.forEach(k=>S[k]+=D.eaten[k]);
  const open=meals.filter(m=>!m.done);
  let banner='';
  if(D.live){
    const e=D.eaten.kcal;
    if(D.left<=0) banner=`<div class="banner warn"><b>Je dagdoel is bereikt</b> (${fmt(e)} kcal gegeten). Heb je nog honger, kies dan iets lichts en eiwitrijks, zoals 250 g magere kwark (ongeveer 145 kcal).</div>`;

    else banner=`<div class="banner">Log wat je eet, dan past de rest van de dag zich automatisch aan op wat je nog over hebt.</div>`;
    if(D.left>0&&S.kcal>T.kcal+50) banner+=`<div class="banner warn">Ook met kleinere porties kom je ongeveer ${fmt(S.kcal-T.kcal)} kcal boven je doel. Sla eventueel het tussendoortje of de avondsnack over.</div>`;
  }
  const row=(l,v,t,u)=>`<div><span>${l}</span><b class="num">${fmt(v)}${u}</b><small class="num">doel ${fmt(t)}${u}</small></div>`;
  const today=(new Date().getDay()+6)%7;
  const dayChips=DAYS.map((d,i)=>`<button class="chip daychip" aria-pressed="${i===w}" data-pw="${i}">${d.slice(0,2)}${i===today?'<i aria-label="vandaag"></i>':''}</button>`).join('');
  const cards=meals.map(({sid,name,items,done,marked})=>{const m=sumItems(items),ch=planChoice(sid,w);

// ---------- Persistence ----------
async function initStore(){
  try{
    const cl=window.claude; if(!cl||!cl.use) throw 0;
    const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
    if(db&&user){const id=await user.id(); if(id){store=db;uid=id;storeMode='account';}}
  }catch(e){}
  await loadAll(); render();
}
function col(){return store.collection('data/users/'+uid)}
async function loadAll(){
  if(store){
    try{
      const [a,b,c]=await Promise.all([col().doc('profile').get(),col().doc('custom').get(),col().doc('supps').get()]);
      if(a.exists) profile={...DEFAULT_PROFILE,...a.data().v};
      if(b.exists) custom=b.data().v||[];
      if(c.exists){suppLog=c.data().v||{};slotDone=c.data().slots||{};}
      await loadDay(day,true);
      migrate();
      return;
    }catch(e){store=null;storeMode='lokaal'}
  }
  try{profile={...DEFAULT_PROFILE,...JSON.parse(localStorage.getItem('vw_profile')||'{}')}}catch(e){}
  try{custom=JSON.parse(localStorage.getItem('vw_custom')||'[]')}catch(e){}
  try{logs=JSON.parse(localStorage.getItem('vw_logs')||'{}')}catch(e){}
  try{suppLog=JSON.parse(localStorage.getItem('vw_supps')||'{}')}catch(e){}
  try{slotDone=JSON.parse(localStorage.getItem('vw_slots')||'{}')}catch(e){}
  migrate();
}
async function loadDay(k,force){
  if(!store||(logs[k]&&!force)) return;
  try{const s=await col().doc('log-'+k).get(); logs[k]=s.exists?(s.data().items||[]):[];}catch(e){logs[k]=logs[k]||[]}
}
async function save(what){
  try{
    if(what==='profile') localStorage.setItem('vw_profile',JSON.stringify(profile));
    if(what==='custom') localStorage.setItem('vw_custom',JSON.stringify(custom));
    if(what==='log') localStorage.setItem('vw_logs',JSON.stringify(logs));
    if(what==='supps'){localStorage.setItem('vw_supps',JSON.stringify(suppLog));localStorage.setItem('vw_slots',JSON.stringify(slotDone));}
  }catch(e){}
  if(!store) return;
  try{
    if(what==='profile') await col().doc('profile').set({v:profile});
    if(what==='custom') await col().doc('custom').set({v:custom});
    if(what==='log') await col().doc('log-'+day).set({items:logs[day]||[]});
    if(what==='supps') await col().doc('supps').set({v:suppLog,slots:slotDone});
  }catch(e){toast('Opslaan lukte niet, probeer het opnieuw')}
}

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>(Math.round(v*10**d)/10**d).toLocaleString('nl-NL',{maximumFractionDigits:d});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
function allFoods(){return BASE.concat(custom.map((c,i)=>({...c,id:'c'+i,cat:'Eigen'})))}
function totals(k,withSupps=true){const t={};KEYS.forEach(x=>t[x]=0);(logs[k]||[]).forEach(it=>KEYS.forEach(x=>t[x]+=(it.n[x]||0)*it.g/100));
  if(withSupps){const taken=suppLog[k]||{};suppList().forEach(s=>{if(!taken[s.id])return;if(s.key)t[s.key]+=+s.dose||0;if(s.multi)Object.entries(s.multi).forEach(([x,v])=>t[x]+=v*(+s.dose||0))})}
  return t}
function dayLabel(k){
  if(k===todayKey()) return 'Vandaag'; if(k===shiftDay(todayKey(),-1)) return 'Gisteren';
  const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'short'});
}

// ---------- Views ----------
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const app=$('#app');
  if(tab==='today') app.innerHTML=viewToday();
  if(tab==='discover') app.innerHTML=viewDiscover();
  if(tab==='profile') app.innerHTML=viewProfile();
  if(tab==='plan') app.innerHTML=viewPlan();
}
function viewToday(){
  const T=targets(), S=totals(day), left=T.kcal-S.kcal, items=logs[day]||[];
  const pct=(a,b)=>Math.min(100,b?a/b*100:0);
  const mac=(k,cls)=>`<div class="macro ${cls}"><div class="lbl">${META[k][0]}</div><div class="v num">${fmt(S[k])}<small> / ${fmt(T[k])} g</small></div><div class="track"><i style="width:${pct(S[k],T[k])}%"></i></div></div>`;
  const micros=MICROS.map(k=>{const p=S[k]/T[k]*100;return `<div class="micro ${p<50&&items.length?'low':''}"><span>${META[k][0]}</span><div class="track"><i style="width:${Math.min(100,p)}%"></i></div><span class="pct num">${fmt(p)}%</span></div>`}).join('');
  const list=items.length?items.map((it,i)=>`<div class="logitem"><div class="nm"><b>${esc(it.name)}</b><span class="num">${fmt(it.g)} g · ${fmt(it.n.p*it.g/100,1)} g eiwit</span></div><span class="kc num">${fmt(it.n.kcal*it.g/100)} kcal</span><button class="del" data-del="${i}" aria-label="Verwijder ${esc(it.name)}">✕</button></div>`).join('')
    :`<div class="empty">Nog niets gelogd op deze dag.<br><button class="btn" data-go="discover">Voeding toevoegen</button></div>`;
  return `<div class="dayhead"><h1>${dayLabel(day)}</h1><div class="arrows"><button class="iconbtn" data-day="-1" aria-label="Vorige dag">‹</button><button class="iconbtn" data-day="1" aria-label="Volgende dag" ${day===todayKey()?'disabled style="opacity:.4"':''}>›</button></div></div>
  <section class="budget"><div class="big num">${fmt(Math.abs(left))}</div><div class="sub">${left>=0?'kcal over van je '+fmt(T.kcal):'kcal boven je doel van '+fmt(T.kcal)}</div>
  <div class="bar"><i style="width:${pct(S.kcal,T.kcal)}%"></i></div><div class="row num"><span>${fmt(S.kcal)} gegeten</span><span>${fmt(pct(S.kcal,T.kcal))}%</span></div></section>
  <div class="macros">${mac('p','p')}${mac('c','c')}${mac('f','f')}${mac('fib','fib')}</div>
  ${viewSupps()}
  <h2 class="sec">Vitamines & mineralen</h2>${Object.values(suppLog[day]||{}).some(Boolean)?'<p class="legend" style="margin-top:-4px">Inclusief je supplementen van deze dag.</p>':''}<div class="microlist">${micros}</div>
  <h2 class="sec">Gegeten</h2>${list}
  <p class="status">Opslag: ${storeMode==='account'?'gekoppeld aan je account':'op dit apparaat'}</p>`;
}
function viewSupps(){
  const list=activeSupps(), taken=suppLog[day]||{};
  if(!list.length) return `<h2 class="sec">Supplementen</h2><div class="empty">Geen supplementen ingesteld.<br><button class="btn" data-go="profile">Supplementen kiezen</button></div>`;
  const cr=list.find(s=>s.id==='creatine');
  let crCard='';
  if(cr){
    const st=streak('creatine',day);
    const dots=[6,5,4,3,2,1,0].map(i=>{const k=shiftDay(day,-i);const on=suppLog[k]&&suppLog[k].creatine;
      const [y,m,d]=k.split('-').map(Number);const wd=new Date(y,m-1,d).toLocaleDateString('nl-NL',{weekday:'narrow'});
      return `<span class="dot ${on?'on':''}"><i></i>${wd}</span>`}).join('');
    crCard=`<button class="crcard" data-supp="creatine" aria-pressed="${!!taken.creatine}">
      <div class="crtop"><div><b>Creatine</b><span class="num">${fmt(cr.dose,1)} ${cr.unit} per dag</span></div><span class="check" aria-hidden="true">✓</span></div>
      <div class="crbot"><div class="streak num"><b>${st}</b><span>${st===1?'dag':'dagen'} op rij</span></div><div class="dots">${dots}</div></div></button>`;
  }
  const tiles=list.filter(s=>s.id!=='creatine').map(s=>`<button class="supp" data-supp="${s.id}" aria-pressed="${!!taken[s.id]}"><span class="check" aria-hidden="true">✓</span><b>${esc(s.name)}</b><span class="num">${fmt(s.dose,1)} ${esc(s.unit)}</span></button>`).join('');
  const n=list.filter(s=>taken[s.id]).length;
  return `<h2 class="sec">Supplementen <span class="cnt num">${n}/${list.length}</span></h2>${crCard}<div class="supps">${tiles}</div>`;
}
function viewDiscover(){
  const T=targets();
  let foods=allFoods().map(f=>({...f,sc:score(f,T)}));
  if(cat!=='Alles') foods=foods.filter(f=>f.cat===cat);
  if(q) foods=foods.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  const sorters={score:(a,b)=>b.sc-a.sc,kcal:(a,b)=>a.kcal-b.kcal,prot:(a,b)=>(b.p/b.kcal||0)-(a.p/a.kcal||0),fib:(a,b)=>(b.fib/b.kcal||0)-(a.fib/a.kcal||0)};
  foods.sort(sorters[sort]);
  const chips=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const rows=foods.map(f=>{
    const ring=2*Math.PI*23, col=f.sc>=55?'var(--leaf)':f.sc>=30?'var(--citrus)':'var(--muted)';
    const top=f.sc>=50&&f.kcal<=150, dense=f.kcal>=350;
    const strip=SCORE_KEYS.map(k=>{const r=f.kcal?(f[k]/f.kcal)/(T[k]/T.kcal):0;const o=Math.min(r,3)/3;return `<i title="${META[k][0]}" style="background:color-mix(in srgb,var(--leaf) ${Math.round(o*100)}%,var(--track))"></i>`}).join('');
    const det=['p','c','f','fib',...MICROS].map(k=>{const r=f.kcal?(f[k]/f.kcal)/(T[k]/T.kcal):0;return `<div class="${r>=1.5&&k!=='c'&&k!=='f'?'hi':''}"><span>${META[k][0]}</span><span class="num">${fmt(f[k],1)} ${META[k][1]}</span></div>`}).join('');
    return `<article class="food ${openId===f.id?'open':''}" data-id="${f.id}">
      <button data-open="${f.id}" aria-expanded="${openId===f.id}"><div class="score num" style="color:${col}"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" fill="none" stroke="var(--track)" stroke-width="4"/><circle cx="26" cy="26" r="23" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${ring*f.sc/100} ${ring}"/></svg>${f.sc}</div>
      <div class="t"><b>${esc(f.name)}${top?'<span class="tag top">Topkeuze</span>':''}${dense?'<span class="tag dense">Calorierijk</span>':''}</b><span class="num">${fmt(f.p,1)} g eiwit · ${fmt(f.fib,1)} g vezels</span></div>
      <div class="kc num"><b>${fmt(f.kcal)}</b><span>kcal/100 g</span></div></button>
      <div class="strip" aria-hidden="true">${strip}</div>
      <div class="detail"><div class="dgrid">${det}</div>
        <div class="addrow"><input type="number" inputmode="decimal" min="1" value="100" id="g-${f.id}" aria-label="Gram"><span>g</span><span class="prev num" id="pv-${f.id}">${fmt(f.kcal)} kcal · ${fmt(f.p,1)} g eiwit</span><button class="btn" data-add="${f.id}">Toevoegen</button></div>
        ${f.cat==='Eigen'?`<button class="btn ghost" style="margin-top:10px" data-rmcustom="${f.id}">Product verwijderen</button>`:''}
      </div></article>`}).join('')||`<div class="empty">Geen producten gevonden.<br><button class="btn" data-custom>Eigen product toevoegen</button></div>`;
  return `<h1 class="disc-h">Ontdekken</h1><p class="disc-p">Score = hoeveel voedingsstoffen je krijgt per calorie, afgestemd op jouw dagbehoefte. Hoger is voedzamer per kcal.</p>
  <input class="search" type="search" placeholder="Zoek een product" value="${esc(q)}" id="q" aria-label="Zoeken">
  <div class="chips">${chips}</div>
  <div class="sortrow"><span>Sorteer</span><select id="sort"><option value="score">Meest voedzaam per kcal</option><option value="kcal">Minste kcal</option><option value="prot">Meeste eiwit per kcal</option><option value="fib">Meeste vezels per kcal</option></select><button class="btn ghost" data-custom style="padding:8px 12px">+ Eigen</button></div>
  <p class="legend">Het balkje onder elk product toont de 12 voedingsstoffen: hoe groener, hoe meer per kcal.</p>
  ${rows}`;
}

   <div class="field"><label for="s-dose">Dosis</label><input id="s-dose" type="number" inputmode="decimal" step="0.1" min="0"></div>
   <div class="field"><label for="s-unit">Eenheid</label><select id="s-unit" style="width:110px"><option>g</option><option>mg</option><option>µg</option><option>capsule</option><option>tablet</option><option>ml</option></select></div>
   <div class="field"><label for="s-key">Telt mee voor<small>optioneel</small></label><select id="s-key" style="width:140px"><option value="">Niets</option>${MICROS.map(k=>`<option value="${k}">${META[k][0]} (${META[k][1]})</option>`).join('')}</select></div>
   <div class="acts"><button class="btn ghost" data-close>Annuleren</button><button class="btn" data-savesupp>Supplement opslaan</button></div>`;
  d.showModal();
}

// ---------- Events ----------
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();scrollTo(0,0)}});
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t) return;
  if(t.dataset.go){tab=t.dataset.go;render();return}
  if(t.dataset.day){day=shiftDay(day,+t.dataset.day);await loadDay(day);render();return}
  if(t.dataset.del!==undefined){logs[day].splice(+t.dataset.del,1);render();save('log');return}
  if(t.dataset.cat){cat=t.dataset.cat;openId=null;render();return}
  if(t.dataset.open){openId=openId===t.dataset.open?null:t.dataset.open;render();return}
  if(t.dataset.add){
    const f=allFoods().find(x=>x.id===t.dataset.add), g=parseFloat($('#g-'+f.id).value);
    if(!(g>0)){toast('Vul een hoeveelheid in grammen in');return}
    const n={};KEYS.forEach(k=>n[k]=f[k]||0);
    (logs[day]=logs[day]||[]).push({name:f.name,g,n});save('log');
    overCheck(`${f.name} toegevoegd`);return}
  if(t.dataset.pick){const [w,sid,i]=t.dataset.pick.split(':');const K=weekKey();const wk={...(profile[K]||{})};wk[w]={...(wk[w]||{}),[sid]:+i};profile[K]=wk;save('profile');render();return}
  if(t.dataset.style){profile.planStyle=t.dataset.style;save('profile');render();return}
  if(t.dataset.pw!==undefined){planW=+t.dataset.pw;render();return}
  if(t.dataset.tick){const d={...(profile.shopDone||{})};d[t.dataset.tick]?delete d[t.dataset.tick]:d[t.dataset.tick]=true;profile.shopDone=d;save('profile');render();return}
  if(t.hasAttribute('data-shopreset')){profile.shopDone={};save('profile');render();return}
  if(t.dataset.store){const n=t.dataset.store,s=new Set(myStores());s.has(n)?s.delete(n):s.add(n);profile.stores=[...s];save('profile');render();return}
  if(t.hasAttribute('data-shop')){showShop=!showShop;render();return}
  if(t.dataset.logmeal){const sid=t.dataset.logmeal,nm=SLOTS.find(s=>s[0]===sid)[1],D=dayPlan(planW);logItems(mealItems(sid,planW,D.fac),D.live?sid:null);render();overCheck(`${nm} gelogd`);return}
  if(t.hasAttribute('data-logday')){const D=dayPlan(planW);D.meals.filter(m=>!m.done).forEach(m=>logItems(m.items,D.live?m.sid:null));render();overCheck('Gelogd');return}
  if(t.dataset.mark){const m=slotDone[day]=slotDone[day]||{};m[t.dataset.mark]=true;save('supps');render();return}
  if(t.dataset.unmark){if(slotDone[day])delete slotDone[day][t.dataset.unmark];save('supps');render();return}
  if(t.dataset.supp){const id=t.dataset.supp;const m=suppLog[day]=suppLog[day]||{};if(m[id])delete m[id];else m[id]=true;render();save('supps');return}
  if(t.hasAttribute('data-addsupp')){suppDialog();return}
  if(t.hasAttribute('data-savesupp')){
    const name=$('#s-name').value.trim();if(!name){toast('Geef het supplement een naam');return}
    const unit=$('#s-unit').value,key=$('#s-key').value;
    if(key&&unit!==META[key][1]){toast('Kies '+META[key][1]+' als eenheid voor '+META[key][0].toLowerCase());return}
    const s={id:'cs'+Date.now(),name,dose:parseFloat($('#s-dose').value)||0,unit,on:true};if(key)s.key=key;
    profile.customSupps=(profile.customSupps||[]).concat(s);save('profile');$('#customDlg').close();render();toast('Supplement opgeslagen');return}
  if(t.dataset.rmsupp){profile.customSupps=(profile.customSupps||[]).filter(s=>s.id!==t.dataset.rmsupp);save('profile');render();return}
  if(t.dataset.sex){profile.sex=t.dataset.sex;save('profile');render();return}
  if(t.hasAttribute('data-custom')){customDialog();return}
  if(t.hasAttribute('data-close')){$('#customDlg').close();return}
  if(t.hasAttribute('data-savecustom')){
    const name=$('#c-name').value.trim();if(!name){toast('Geef het product een naam');return}
    const o={name};KEYS.forEach(k=>{const el=$('#c-'+k);o[k]=el?(parseFloat(el.value)||0):0});
    custom.push(o);save('custom');$('#customDlg').close();cat='Eigen';q='';render();toast('Product opgeslagen');return}
  if(t.dataset.rmcustom){custom.splice(+t.dataset.rmcustom.slice(1),1);save('custom');openId=null;render();return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){q=el.value;const pos=el.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);return}
  if(el.id&&el.id.startsWith('g-')){const id=el.id.slice(2),f=allFoods().find(x=>x.id===id),g=parseFloat(el.value)||0;$('#pv-'+id).textContent=`${fmt(f.kcal*g/100)} kcal · ${fmt(f.p*g/100,1)} g eiwit`}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='sort'){sort=el.value;render();return}
  if(el.hasAttribute('data-autoscale')){profile.autoScale=el.checked;save('profile');render();return}
  if(el.dataset.son){profile.supps={...profile.supps,[el.dataset.son]:{...(profile.supps||{})[el.dataset.son],on:el.checked}};save('profile');render();return}
  if(el.dataset.sdose){profile.supps={...profile.supps,[el.dataset.sdose]:{...(profile.supps||{})[el.dataset.sdose],dose:parseFloat(el.value)||0}};save('profile');render();return}
  if(el.dataset.p){profile[el.dataset.p]=parseFloat(el.value)||0;save('profile');render();}
});
const _r=render;render=function(){_r();const s=$('#sort');if(s)s.value=sort};
render();initStore();
</script>
</body>
</html>
