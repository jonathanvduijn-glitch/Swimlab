# Bouwt de iPhone-app Wine Rack op een Mac van GitHub, zodat fouten en
# waarschuwingen zichtbaar zijn zonder dat je eigen Mac iets hoeft te doen.
name: Wine Rack bouwen

on:
  push:
    paths:
      - "WineRack/**"
      - ".github/workflows/winerack-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Nieuwste Xcode kiezen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Gekozen: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Bouwen voor de iOS-simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project WineRack/WineRack.xcodeproj \
            -target WineRack \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Waarschuwingen in eigen code controleren
        run: |
          grep -E "/WineRack/WineRack/.*(warning|error):" build.log | sort -u > problems.txt || true
          if [ -s problems.txt ]; then
            echo "Gevonden waarschuwingen of fouten:"
            cat problems.txt
            exit 1
          fi
          echo "Geen waarschuwingen in de eigen code."
